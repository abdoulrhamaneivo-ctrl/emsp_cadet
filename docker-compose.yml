# EMSPCONNECT — stack minimale production (PostgreSQL + app Django)
#
# Usage :
#   docker compose up -d
#   docker compose exec app python manage.py migrate
#   docker compose exec app python manage.py createsuperuser
#
# MySQL en dev local (hors Docker) : voir docs/MYSQL.md — variables DB_ENGINE=mysql dans aine-cadet/.env
#
# Vitrine statique : servir html5up-editorial/ via nginx/CDN (hors ce compose).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aine_cadet
      POSTGRES_USER: aine_cadet
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aine_cadet -d aine_cadet"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./aine-cadet
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALLOWED_HOSTS: localhost,127.0.0.1,app
      DATABASE_URL: postgres
      DB_NAME: aine_cadet
      DB_USER: aine_cadet
      DB_PASSWORD: ${DB_PASSWORD:-changeme_prod}
      DB_HOST: db
      DB_PORT: "5432"
      EMSP_VITRINE_URL: ${EMSP_VITRINE_URL:-http://localhost:8080}
      AINE_CADET_PUBLIC_URL: ${AINE_CADET_PUBLIC_URL:-http://localhost:8000}
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles

volumes:
  pgdata:
  media:
  staticfiles:
