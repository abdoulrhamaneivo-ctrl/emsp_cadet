<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280">
  <defs>
    <!-- Dégradé pour l'icône (Bleu profond vers turquoise) -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5276;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#147c71;stop-opacity:1" />
    </linearGradient>

    <!-- Dégradé pour la balance -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef9c00" />
      <stop offset="100%" style="stop-color:#ffcc66" />
    </linearGradient>

    <!-- Style CSS pour les animations -->
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slideUp {
        from { transform: translateY(15px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes waveDraw {
        from { stroke-dashoffset: 50; }
        to { stroke-dashoffset: 0; }
      }

      /* Classes d'animation */
      .anim-container { animation: fadeIn 0.8s ease-out forwards; }
      .anim-icon { animation: float 4s ease-in-out infinite; }
      .anim-text { opacity: 0; animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; }
      .anim-wave { 
        stroke-dasharray: 10; 
        animation: waveDraw 4s linear infinite; 
      }
    </style>
  </defs>

  <!-- Groupe d'apparition global -->
  <g class="anim-container">
    <!-- Fond clair avec dégradé subtil -->
    <rect width="400" height="280" fill="#f8fafc"/>
    
    <!-- DÉCORATION THÉMATIQUE : Sceau officiel de gouvernance et lignes de réseau -->
    <g stroke="#1a5276" stroke-width="1" fill="none" opacity="0.12">
      <!-- Lignes de réseau diagonales -->
      <line x1="240" y1="80" x2="380" y2="220" />
      <line x1="280" y1="60" x2="420" y2="200" stroke-dasharray="3 3" />
      <circle cx="280" cy="120" r="3" fill="#1a5276" />
      <circle cx="380" cy="140" r="3" fill="#1a5276" />

      <!-- Sceau de Régulation circulaire -->
      <circle cx="330" cy="140" r="45" />
      <circle cx="330" cy="140" r="41" stroke-dasharray="3 3" />
      
      <!-- Colonnes de la loi simplifiées à l'intérieur du sceau -->
      <path d="M 320,150 L 340,150 M 323,150 L 323,130 M 330,150 L 330,130 M 337,150 L 337,130 M 320,130 L 340,130" stroke-width="1.5" />
      <polygon points="320,130 330,123 340,130" />

      <!-- Texte incurvé dans le sceau -->
      <path id="governancePath" d="M 295,130 A 35,35 0 0,1 365,130" fill="none" stroke="none" />
      <text font-family="sans-serif" font-size="7" font-weight="bold" fill="#1a5276" letter-spacing="1">
        <textPath href="#governancePath" startOffset="50%" text-anchor="middle">EMSP • RÉGULATION</textPath>
      </text>
    </g>

    <!-- Barre de base orange (Charte EMSP) -->
    <rect x="0" y="250" width="400" height="4" fill="#ef9c00" />

    <!-- Icône RegNUM animée (Bouclier + Balance) -->
    <g class="anim-icon">
      <!-- Carré principal avec ombre portée douce -->
      <rect x="30" y="45" width="65" height="65" rx="14" fill="url(#iconGrad)" style="filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.15));" />
      
      <!-- ÉLÉMENT AJOUTÉ : La Balance de la Régulation -->
      <!-- Socle et pilier central -->
      <path d="M 52,90 L 73,90 M 62.5,90 L 62.5,58" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      
      <!-- Fléau de la balance (Légèrement incliné pour symboliser l'ajustement/régulation) -->
      <path d="M 48,64 L 77,61" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      
      <!-- Plateau Gauche -->
      <path d="M 48,64 L 43,76 L 55,76 Z" fill="none" stroke="#ffffff" stroke-width="1" />
      <path d="M 41,76 A 7,7 0 0,0 57,76" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
      
      <!-- Plateau Droite (Plus bas pour l'effet de bascule de régulation) -->
      <path d="M 77,61 L 72,73 L 84,73 Z" fill="none" stroke="#ffffff" stroke-width="1" />
      <path d="M 70,73 A 7,7 0 0,0 86,73" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />

      <!-- Contour en filigrane : Bouclier de protection numérique -->
      <path d="M 38,51 L 62.5,45 L 87,51 L 87,68 C 87,80 62.5,88 62.5,88 C 62.5,88 38,80 38,68 Z" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 2" opacity="0.4" />
    </g>

    <!-- Bloc de texte -->
    <g class="anim-text">
      <!-- Titre RegNUM -->
      <text x="115" y="76" fill="#1a5276" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" style="letter-spacing: 0.5px;">
        Reg<tspan fill="#ef9c00">NUM</tspan>
      </text>

      <!-- Petite ligne de décoration orange -->
      <rect x="115" y="83" width="40" height="2" fill="#ef9c00" />
      
      <!-- Sous-titre -->
      <text x="115" y="104" fill="#475569" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
        Mastère Spécialisé
      </text>
      
      <!-- Description détaillée -->
      <text x="115" y="122" fill="#64748b" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400">
        Régulation de l'Économie Numérique
      </text>
    </g>

    <!-- Badge "Expertise" discret en haut à droite -->
    <g class="anim-text" style="animation-delay: 0.4s;">
      <rect x="290" y="20" width="90" height="20" rx="10" fill="#e2e8f0" />
      <text x="335" y="33" text-anchor="middle" fill="#1a5276" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" font-weight="800" letter-spacing="0.5">EMSP CERTIFIED</text>
    </g>
  </g>
</svg>