<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280">
  <defs>
    <!-- Dégradé pour le fond -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff" />
      <stop offset="100%" style="stop-color:#edf2f0" />
    </linearGradient>

    <!-- Dégradé pour l'icône -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a9a8c" />
      <stop offset="100%" style="stop-color:#147c71" />
    </linearGradient>

    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slideUp {
        from { transform: translateY(15px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes waveDraw {
        from { stroke-dashoffset: 50; }
        to { stroke-dashoffset: 0; }
      }

      /* Classes d'animation */
      .anim-container { animation: fadeIn 0.8s ease-out forwards; }
      .anim-icon { animation: float 4s ease-in-out infinite; }
      .anim-text { opacity: 0; animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; }
      .anim-wave { 
        stroke-dasharray: 10; 
        animation: waveDraw 4s linear infinite; 
      }
    </style>
  </defs>

  <!-- Groupe d'apparition global -->
  <g class="anim-container">
    <!-- Fond avec dégradé -->
    <rect width="400" height="280" fill="url(#bgGrad)"/>

    <!-- DÉCORATION THÉMATIQUE : Cachet postal et lignes ondulées d'oblitération -->
    <g stroke="#147c71" stroke-width="1" fill="none" opacity="0.12">
      <!-- Lignes ondulées -->
      <path class="anim-wave" d="M 230,110 Q 260,95 290,110 T 350,110 T 410,110" />
      <path class="anim-wave" d="M 230,130 Q 260,115 290,130 T 350,130 T 410,130" style="animation-delay: -1s;" />
      <path class="anim-wave" d="M 230,150 Q 260,135 290,150 T 350,150 T 410,150" style="animation-delay: -2s;" />
      
      <!-- Double cercle du cachet postal -->
      <circle cx="330" cy="130" r="45" />
      <circle cx="330" cy="130" r="41" stroke-dasharray="3 3" />
      
      <!-- Texte à l'intérieur du cachet -->
      <path id="stampPath" d="M 295,130 A 35,35 0 0,1 365,130" fill="none" stroke="none" />
      <text font-family="sans-serif" font-size="8" font-weight="bold" fill="#147c71" letter-spacing="1">
        <textPath href="#stampPath" startOffset="50%" text-anchor="middle">EMSP • ABIDJAN</textPath>
      </text>
    </g>

    <!-- Ligne de soulignement orange (Charte graphique) -->
    <rect x="0" y="250" width="400" height="4" fill="#ef9c00" />

    <!-- Icône Logotype animée -->
    <g class="anim-icon">
      <!-- Carré de fond avec ombre portée douce -->
      <rect x="30" y="45" width="65" height="65" rx="14" fill="url(#iconGrad)" style="filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.15));" />
      
      <!-- ÉLÉMENT AJOUTÉ : Enveloppe + Diplôme -->
      <!-- Le Diplôme (Scroll) blanc et orange -->
      <path d="M 52,61 C 52,57 58,57 58,61 L 58,74 C 58,78 52,78 52,74 Z" fill="#ffffff" />
      <path d="M 58,61 C 58,57 64,57 64,61 L 64,74 C 64,78 58,78 58,74 Z" fill="#e1e8e5" />
      <!-- Ruban du diplôme (Orange de la charte) -->
      <rect x="51" y="66" width="14" height="3" fill="#ef9c00" />
      <path d="M 58,69 L 56,76 L 58,74 L 60,76 Z" fill="#ef9c00" />

      <!-- L'Enveloppe (Devant le diplôme) -->
      <!-- Corps de l'enveloppe -->
      <path d="M 44,68 L 81,68 L 81,90 C 81,92 79,94 77,90 L 62.5,80 L 48,90 C 46,94 44,92 44,90 Z" fill="#ffffff" opacity="0.95" />
      <!-- Lignes de pliure de l'enveloppe -->
      <path d="M 44,68 L 62.5,81 L 81,68" fill="none" stroke="#147c71" stroke-width="1.5" stroke-linejoin="round" />
      <path d="M 44,90 L 58,78 M 81,90 L 67,78" stroke="#147c71" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Groupe de texte -->
    <g class="anim-text">
      <!-- Sigle FSP -->
      <text x="115" y="76" fill="#264719" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" style="letter-spacing: 0.5px;">FSP</text>
      
      <!-- Petite ligne de décoration orange -->
      <rect x="115" y="83" width="40" height="2" fill="#ef9c00" />
      
      <!-- Sous-titre -->
      <text x="115" y="104" fill="#5a6b63" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Formations Supérieures Postales</text>
    </g>
  </g>
</svg>