[project]
name = "emsp-backend"
version = "0.1.0"
description = "EMSP Connect v2 — backend Django (messagerie temps réel & RDV), contrat doc 21"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "djangorestframework-simplejwt>=5.3",
    "channels>=4.1",
    "channels-redis>=4.2",
    "daphne>=4",
    "drf-spectacular>=0.27",
    "dj-database-url>=3.1.2",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
    "django-cloudinary-storage>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "tests.py", "tests_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Migrations générées par Django : longues lignes historiques, on n'y touche pas.
"**/migrations/*" = ["E501"]
