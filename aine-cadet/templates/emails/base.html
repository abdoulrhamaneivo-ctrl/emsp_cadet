<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f4f7f6;font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#1a2e2c;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7f6;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);">
          <tr>
            <td style="background:#147c71;padding:20px 28px;">
              <p style="margin:0;color:#ffffff;font-size:18px;font-weight:600;">EMSP — École Multinationale Supérieure des Postes</p>
              <p style="margin:4px 0 0;color:#d4efe9;font-size:13px;">{{ app_name }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px;background:#eef5f4;border-top:1px solid #d8e8e5;">
              <p style="margin:0;font-size:12px;color:#5a726e;line-height:1.5;">
                Cet e-mail a été envoyé automatiquement. Merci de ne pas y répondre directement sauf indication contraire.<br>
                {% if vitrine_url %}<a href="{{ vitrine_url }}" style="color:#147c71;">www.emsp.int</a>{% endif %}
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
